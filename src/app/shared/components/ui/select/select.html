<div class="flex flex-col gap-xs w-full">
  @if (label()) {
    <label [for]="id()" class="font-label-sm text-on-surface-variant uppercase tracking-widest">
      {{ label() }}
      @if (required()) {
        <span class="text-error ml-1" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="relative">
    <select
      [value]="value()"
      [disabled]="disabled()"
      [required]="required()"
      [class]="selectClasses"
      (change)="onChange($event)"
    >
      @if (placeholder()) {
        <option value="" disabled [selected]="!value()">
          {{ placeholder() }}
        </option>
      }

      @for (option of options(); track option.value) {
        <option
          [value]="option.value"
          [disabled]="option.disabled ?? false"
          [selected]="option.value === value()"
        >
          {{ option.label }}
        </option>
      }
    </select>

    <!-- Chevron icon -->
    <div
      class="absolute right-0 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-4 w-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
      </svg>
    </div>
  </div>

  @if (error()) {
    <span class="font-label-sm text-error" role="alert">{{ error() }}</span>
  } @else if (hint()) {
    <span class="font-label-sm text-on-surface-variant">{{ hint() }}</span>
  }
</div>
