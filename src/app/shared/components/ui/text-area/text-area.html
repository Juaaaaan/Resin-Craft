<div class="flex flex-col gap-xs w-full">
  @if (label()) {
    <label [for]="id()" class="font-label-sm text-on-surface-variant uppercase tracking-widest">
      {{ label() }}
      @if (required()) {
        <span class="text-error ml-1" aria-hidden="true">*</span>
      }
    </label>
  }

  <textarea
    [value]="value()"
    [placeholder]="placeholder()"
    [rows]="rows()"
    [disabled]="disabled()"
    [required]="required()"
    [attr.maxlength]="maxLength()"
    [class]="inputClasses()"
    (input)="onInput($event)"
  >
  </textarea>

  <div class="flex justify-between items-start">
    <div>
      @if (error()) {
        <span class="font-label-sm text-error" role="alert">{{ error() }}</span>
      } @else if (hint()) {
        <span class="font-label-sm text-on-surface-variant">{{ hint() }}</span>
      }
    </div>

    @if (maxLength()) {
      <span class="font-label-sm text-on-surface-variant ml-auto">
        {{ currentLength() }} / {{ maxLength() }}
      </span>
    }
  </div>
</div>
